# Dyuti OS login screen (SDDM). Uses the Breeze theme with our wallpaper for a
# consistent look from boot → login → desktop. Custom SDDM theme comes in M2.

[Theme]
Current=breeze

[General]
# Numlock on at login — small quality-of-life touch.
Numlock=on

[Wayland]
EnableHiDPI=true

[X11]
EnableHiDPI=true
