[Settings]
# GTK4 / libadwaita apps: light + Tela icons to match the desktop.
# (libadwaita apps ignore the theme name but honour the dark preference.)
gtk-theme-name=Breeze
gtk-icon-theme-name=Dyuti
gtk-font-name=Cantarell 10
gtk-cursor-theme-name=breeze_cursors
gtk-application-prefer-dark-theme=false
gtk-enable-animations=true
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
