<?xml version="1.0" encoding="UTF-8"?>
<!-- Dyuti default wallpaper.
     "Dyuti" (Sanskrit) = radiance / light. The composition is a dawn: a warm
     sun rising over a deep indigo sky, light fanning out across it. Pure vector
     so it scales crisply to any resolution. Palette matches the Dyuti color
     scheme (saffron #ff9d4d accent on indigo #14172a). -->
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160"
     viewBox="0 0 3840 2160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky: deep indigo above, warming toward the rising sun below. -->
    <radialGradient id="sky" cx="50%" cy="86%" r="95%">
      <stop offset="0%"   stop-color="#ffd27a"/>
      <stop offset="14%"  stop-color="#ff9d4d"/>
      <stop offset="34%"  stop-color="#b5478f"/>
      <stop offset="60%"  stop-color="#3b2a72"/>
      <stop offset="100%" stop-color="#0d1030"/>
    </radialGradient>
    <!-- Soft bloom around the sun disc. -->
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff4d6" stop-opacity="0.95"/>
      <stop offset="40%"  stop-color="#ffe7b0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffe7b0" stop-opacity="0"/>
    </radialGradient>
    <!-- Top vignette to keep desktop icons / panels readable. -->
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1030" stop-opacity="0.55"/>
      <stop offset="35%"  stop-color="#0d1030" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="3840" height="2160" fill="url(#sky)"/>

  <!-- Radiating light rays from the sun (the heart of "Dyuti"). -->
  <g transform="translate(1920,1820)" opacity="0.10" fill="#ffe7b0">
    <polygon points="0,0 -90,-2200 90,-2200"/>
    <polygon points="0,0 -90,-2200 90,-2200" transform="rotate(30)"/>
    <polygon points="0,0 -90,-2200 90,-2200" transform="rotate(60)"/>
    <polygon points="0,0 -90,-2200 90,-2200" transform="rotate(-30)"/>
    <polygon points="0,0 -90,-2200 90,-2200" transform="rotate(-60)"/>
    <polygon points="0,0 -60,-2200 60,-2200" transform="rotate(15)"/>
    <polygon points="0,0 -60,-2200 60,-2200" transform="rotate(45)"/>
    <polygon points="0,0 -60,-2200 60,-2200" transform="rotate(-15)"/>
    <polygon points="0,0 -60,-2200 60,-2200" transform="rotate(-45)"/>
  </g>

  <!-- Concentric radiance arcs. -->
  <g transform="translate(1920,1820)" fill="none" stroke="#ffe7b0" stroke-opacity="0.08">
    <circle r="520" stroke-width="3"/>
    <circle r="760" stroke-width="2"/>
    <circle r="1040" stroke-width="2"/>
  </g>

  <!-- Sun bloom + disc. -->
  <circle cx="1920" cy="1820" r="620" fill="url(#bloom)" filter="url(#soft)"/>
  <circle cx="1920" cy="1820" r="300" fill="#fff4d6" opacity="0.9"/>

  <!-- Scattered stars in the upper sky. -->
  <g fill="#ffffff">
    <circle cx="520"  cy="280" r="3" opacity="0.7"/>
    <circle cx="980"  cy="180" r="2" opacity="0.5"/>
    <circle cx="1500" cy="320" r="2.5" opacity="0.6"/>
    <circle cx="2300" cy="220" r="2" opacity="0.5"/>
    <circle cx="2900" cy="360" r="3" opacity="0.7"/>
    <circle cx="3380" cy="240" r="2" opacity="0.5"/>
    <circle cx="3200" cy="540" r="2" opacity="0.4"/>
    <circle cx="680"  cy="560" r="2" opacity="0.4"/>
    <circle cx="1740" cy="120" r="2" opacity="0.5"/>
  </g>

  <!-- Layered horizon ridges for depth. -->
  <path d="M0,1980 C 700,1880 1200,1960 1920,1900 C 2700,1835 3300,1930 3840,1880 L3840,2160 L0,2160 Z"
        fill="#1a1740" opacity="0.85"/>
  <path d="M0,2060 C 800,2000 1500,2070 1920,2030 C 2600,1965 3200,2055 3840,2010 L3840,2160 L0,2160 Z"
        fill="#0d1030"/>

  <rect width="3840" height="2160" fill="url(#vignette)"/>
</svg>
