<?xml version="1.0" encoding="UTF-8"?>
<!-- Dyuti default wallpaper (charcoal direction).
     "Dyuti" (Sanskrit) = radiance. Premium near-black field with a single
     restrained saffron glow low in the frame — "light in the dark," never a
     dominant color field. Pure vector, scales crisply to any resolution.
     Palette from design-tokens.md: charcoal bg #08090b–#1a1d24, accent #ff9d4d. -->
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160"
     viewBox="0 0 3840 2160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Charcoal field: faintly lifts toward the lower-right where the glow sits. -->
    <radialGradient id="field" cx="80%" cy="86%" r="74%">
      <stop offset="0%"   stop-color="#1a1d24"/>
      <stop offset="42%"  stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#08090b"/>
    </radialGradient>
    <!-- The one saffron radiance — soft, contained, never fills the frame. -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff9d4d" stop-opacity="0.40"/>
      <stop offset="38%"  stop-color="#ff9d4d" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ff9d4d" stop-opacity="0"/>
    </radialGradient>
    <!-- Top vignette keeps panels / desktop icons readable. -->
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#08090b" stop-opacity="0.5"/>
      <stop offset="32%"  stop-color="#08090b" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="3840" height="2160" fill="url(#field)"/>

  <!-- Single radiant highlight, low-right. The bright pinpoint is the "source". -->
  <circle cx="3180" cy="2000" r="980" fill="url(#glow)"/>
  <circle cx="3180" cy="2000" r="4" fill="#ffd9b0" opacity="0.9"/>

  <!-- Faint neutral contour lines for quiet depth and structure. -->
  <g fill="none" stroke="#262b33" stroke-width="2.4" opacity="0.45">
    <path d="M-100,1320 C 1000,1200 1900,1420 4000,1180"/>
    <path d="M-100,1520 C 1050,1430 2000,1640 4000,1390"/>
    <path d="M-100,1720 C 1100,1660 2100,1860 4000,1600"/>
  </g>

  <rect width="3840" height="2160" fill="url(#vignette)"/>
</svg>
