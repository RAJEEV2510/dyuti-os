<?xml version="1.0" encoding="UTF-8"?>
<!-- Dyuti lock / login wallpaper (charcoal direction).
     The darkest, calmest variant so the login card and clock stay readable.
     A near-centered, very soft saffron glow behind where the card sits, plus a
     center darkening. Used by the SDDM theme and the Plasma lock screen. -->
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160"
     viewBox="0 0 3840 2160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="field" cx="50%" cy="58%" r="80%">
      <stop offset="0%"   stop-color="#16191f"/>
      <stop offset="55%"  stop-color="#0b0d10"/>
      <stop offset="100%" stop-color="#08090b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff9d4d" stop-opacity="0.22"/>
      <stop offset="50%"  stop-color="#ff9d4d" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ff9d4d" stop-opacity="0"/>
    </radialGradient>
    <!-- Center darkening so the unlock prompt reads clearly. -->
    <radialGradient id="center" cx="50%" cy="46%" r="58%">
      <stop offset="0%"   stop-color="#08090b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#08090b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="3840" height="2160" fill="url(#field)"/>

  <!-- Soft glow rising from below center. -->
  <circle cx="1920" cy="1720" r="1300" fill="url(#glow)"/>

  <!-- A few faint contour lines for texture. -->
  <g fill="none" stroke="#262b33" stroke-width="2.2" opacity="0.35">
    <path d="M-100,1560 C 1100,1480 2200,1660 4000,1440"/>
    <path d="M-100,1760 C 1150,1700 2300,1880 4000,1660"/>
  </g>

  <rect width="3840" height="2160" fill="url(#center)"/>
</svg>
